name: PR security scans

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks" reports
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version | tee reports/gitleaks-version.txt

      - name: Scan PR commit history with redacted output
        id: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --redact \
            --report-format json \
            --report-path reports/gitleaks.json \
            --log-opts="$BASE_SHA..$HEAD_SHA" .
          scan_rc=$?
          set -e
          echo "exit_code=$scan_rc" >> "$GITHUB_OUTPUT"

      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on findings or scanner errors
        if: always()
        env:
          SCAN_EXIT_CODE: ${{ steps.gitleaks.outputs.exit_code }}
        run: test "$SCAN_EXIT_CODE" = "0"

  python-security:
    name: python-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install pinned security tools from the lock
        run: uv sync --locked --group security --no-install-project

      - name: Export the locked runtime dependency graph
        run: |
          mkdir -p reports
          uv export --locked --no-dev --no-group security --no-emit-project \
            --format requirements-txt --output-file reports/runtime-requirements.txt

      - name: Audit locked runtime dependencies
        id: pip_audit
        continue-on-error: true
        run: |
          set +e
          uv run --locked --no-sync --group security pip-audit \
            --disable-pip --no-deps \
            --format json --output reports/pip-audit.json \
            -r reports/runtime-requirements.txt
          scan_rc=$?
          set -e
          echo "exit_code=$scan_rc" >> "$GITHUB_OUTPUT"

      - name: Run Bandit against the application source
        id: bandit
        continue-on-error: true
        run: |
          set +e
          uv run --locked --no-sync --group security bandit \
            -r src -f json -o reports/bandit-raw.json
          scan_rc=$?
          set -e
          echo "exit_code=$scan_rc" >> "$GITHUB_OUTPUT"

      - name: Remove source snippets from the Bandit report
        if: always()
        run: |
          if [ -f reports/bandit-raw.json ]; then
            uv run --locked --no-sync --group security python \
              scripts/security/redact_bandit_report.py \
              reports/bandit-raw.json reports/bandit.json
            rm reports/bandit-raw.json
          fi

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on findings or scanner errors
        if: always()
        env:
          PIP_AUDIT_EXIT_CODE: ${{ steps.pip_audit.outputs.exit_code }}
          BANDIT_EXIT_CODE: ${{ steps.bandit.outputs.exit_code }}
        run: |
          test "$PIP_AUDIT_EXIT_CODE" = "0"
          test "$BANDIT_EXIT_CODE" = "0"
