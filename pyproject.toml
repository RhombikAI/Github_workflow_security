[project]
name = "pr-security-demo"
version = "0.1.0"
description = "Small Flask app for demonstrating pull request security checks"
requires-python = ">=3.14"
dependencies = [
    "Flask>=3.1,<4",
    "waitress>=3.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_security_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
